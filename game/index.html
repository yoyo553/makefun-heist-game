<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Glass Vault — a heist game of cases, cameras and one alarm</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0d0c; }
  #game { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
  /* Spoken by screen readers, never painted: the live status line. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; white-space: nowrap; clip-path: inset(50%); }
</style>
</head>
<body>
<canvas id="game" aria-label="The Glass Vault: cross each gallery, lift the loot, crack the vault, watch the alarm, and reach the getaway van"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
